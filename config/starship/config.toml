"$schema" = 'https://starship.rs/config-schema.json'

# Match Zellij's ANSI theme using the terminal palette.
# Powerline directory, changed-file counts, and line diff.
add_newline = true

format = "$directory$vcs$status$character"

[directory]
format = '[ $path ]($style)[$read_only]($read_only_style)[](fg:green bg:black)'
style = "bold fg:black bg:green"
read_only = " [LOCKED]"
read_only_style = "fg:black bg:green"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false

# Prefer jj in colocated repositories; retain Git for Git-only projects.
[vcs]
order = ["jj", "git"]
jj_modules = "$jj_status$jj_metrics"
git_modules = "$git_status$git_metrics"

[jj_status]
format = '([ $all]($style))'
style = "fg:yellow bg:black"
conflicted = "! "
description_empty = ""
immutable = ""
added = '+$count '
copied = '=$count '
deleted = '-$count '
modified = '~$count '
renamed = '>$count '

[git_status]
format = '([ $all_status]($style))'
style = "fg:yellow bg:black"
conflicted = "CONFLICT "
ahead = 'UP:${count} '
behind = 'DOWN:${count} '
diverged = 'UP:${ahead_count} DOWN:${behind_count} '
untracked = '?${count} '
stashed = 'STASH:${count} '
modified = '~${count} '
staged = '+${count} '
renamed = '>${count} '
deleted = '-${count} '

[jj_metrics]
format = '[ +$added](fg:green bg:black)[ -$deleted ](fg:red bg:black)'
only_nonzero_diffs = false

[git_metrics]
disabled = false
format = '[ +$added](fg:green bg:black)[ -$deleted ](fg:red bg:black)'
only_nonzero_diffs = false

[status]
disabled = false
format = '[ ERR:$status ](bold fg:red bg:black)'

[character]
success_symbol = '[](black)'
error_symbol = '[](black)'
vimcmd_symbol = '[](yellow)'
