inherits = "base16_terminal"

"variable" = { fg = "cyan" }
"variable.builtin" = { fg = "light-cyan", modifiers = ["italic"] }
"variable.parameter" = "light-gray"
"variable.other.member" = "cyan"
"type" = "light-magenta"
"constructor" = "light-magenta"
"function" = { fg = "light-blue", modifiers = ["bold"] }
"function.macro" = "light-yellow"
"keyword" = "magenta"
"attribute" = "yellow"
"constant" = "yellow"
"constant.numeric" = "light-yellow"
"string" = "light-green"
"constant.character.escape" = { fg = "light-cyan", modifiers = ["bold"] }
"comment" = { fg = "gray", modifiers = ["dim", "italic"] }

"ui.menu" = { fg = "default", bg = "black" }
"markup.heading.1" = { fg = "green", modifiers = ["bold"] }
"markup.heading.2" = { fg = "cyan", modifiers = ["bold"] }
"markup.heading.3" = { fg = "magenta", modifiers = ["bold"] }
"markup.heading.4" = { fg = "light-green", modifiers = ["bold"] }
"markup.heading.5" = { fg = "light-cyan", modifiers = ["bold"] }
"markup.heading.6" = { fg = "light-magenta", modifiers = ["bold"] }
"markup.raw" = { bg = "black" }
"markup.raw.block" = { bg = "black" }
"markup.heading.marker" = { modifiers = ["dim"] }
"markup.link.url" = { fg = "green", modifiers = [] }
"markup.link.text" = { fg = "light-green", modifiers = ["bold"] }
"markup.link.label" = { fg = "light-green", modifiers = ["bold"] }
"markup.list" = { modifiers = ["dim"] }
"markup.quote" = { fg = "yellow" }
"diagnostic" = { modifiers = [], underline = { color = "red", style = "curl" } }
