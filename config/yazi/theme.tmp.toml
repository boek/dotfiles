sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#7bcf6b", bold = true }
perm_read = { fg = "#95ff80" }
perm_write = { fg = "#d4b84f" }
perm_exec = { fg = "#ff5555" }
perm_sep = { fg = "#2e402a" }
