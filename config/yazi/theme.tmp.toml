separator_style = { fg = "#2e402a" }

[confirm]
border = { fg = "#d4b84f" }
title = { fg = "#95ff80", bold = true }
body = { fg = "#95ff80" }
list = { fg = "#62a058" }
btn_yes = { fg = "#050804", bg = "#ff5555", bold = true }
btn_no = { fg = "#050804", bg = "#95ff80", bold = true }
btn_labels = [" yes ", " no "]

[spot]
border = { fg = "#62a058" }
title = { fg = "#95ff80", bold = true }
tbl_col = { fg = "#050804", bg = "#7bcf6b", bold = true }
tbl_cell = { fg = "#95ff80", bg = "#1b2a17" }

[notify]
title_info = { fg = "#95ff80", bold = true }
title_warn = { fg = "#d4b84f", bold = true }
title_error = { fg = "#ff5555", bold = true }

[pick]
border = { fg = "#62a058" }
active = { fg = "#050804", bg = "#95ff80", bold = true }
inactive = { fg = "#95ff80" }

[input]
border = { fg = "#62a058" }
title = { fg = "#95ff80", bold = true }
value = { fg = "#95ff80" }
selected = { fg = "#050804", bg = "#95ff80", bold = true }

[cmp]
border = { fg = "#62a058" }
active = { fg = "#050804", bg = "#95ff80", bold = true }
inactive = { fg = "#95ff80" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#62a058" }
title = { fg = "#95ff80", bold = true }
hovered = { fg = "#050804", bg = "#95ff80", bold = true }

[help]
on = { fg = "#d4b84f", bold = true }
run = { fg = "#7bcf6b" }
desc = { fg = "#95ff80" }
hovered = { fg = "#050804", bg = "#95ff80", bold = true }
footer = { fg = "#62a058", bg = "#10180e" }
icon_info = "i"
icon_warn = "!"
icon_error = "x"

[filetype]
rules = [
  { mime = "image/*", fg = "#d4b84f" },
  { mime = "{audio,video}/*", fg = "#7bcf6b" },
  { mime = "application/{zip,gzip,x-tar,x-bzip*,x-7z-compressed,x-rar}", fg = "#d4b84f" },
  { mime = "inode/empty", fg = "#2e402a" },
  { url = "*", is = "orphan", fg = "#ff5555", bold = true },
  { url = "*", is = "exec", fg = "#95ff80", bold = true },
  { url = "*", is = "link", fg = "#7bcf6b" },
  { url = "*/", fg = "#95ff80", bold = true },
  { url = "*", fg = "#62a058" },
]

[icon]
prepend_conds = [
  { if = "orphan", text = "!", fg = "#ff5555" },
  { if = "link", text = "@", fg = "#7bcf6b" },
  { if = "dir", text = "/", fg = "#95ff80" },
  { if = "exec", text = "*", fg = "#d4b84f" },
  { if = "!dir", text = "-", fg = "#62a058" },
]
